[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; ---- Contraseña maestra (crear/borrar/duplicar bases). CAMBIALA. ----
admin_passwd = PONE_UNA_CLAVE_LARGA_ACA

; ---- Conexión a PostgreSQL (servicio "db" del compose) ----
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; ---- Seguridad: sin gestor de bases por web, y esta instancia solo
;      sirve la base "odoo18_prueba" ----
list_db = False
dbfilter = ^odoo18_prueba$

; ---- Se accede por http://IP:8069 directo (sin reverse proxy) ----
proxy_mode = False

; ---- Rendimiento: subí a workers=2..4 si la VM tiene 4GB+ de RAM.
;      Con 0 corre en modo single-thread (suficiente para pruebas). ----
workers = 0
